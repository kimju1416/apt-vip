<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>아파트 레이더 VIP</title>
<meta name="description" content="초대받은 VIP 전용 아파트 실거래·매물 분석 대시보드">
<meta property="og:title" content="아파트 레이더 VIP">
<meta property="og:description" content="실거래·전세·매물을 매일 모아 판정까지 — 초대 코드가 있어야 들어갑니다">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
:root{
  --ink:#06080C;--glass:rgba(9,12,18,.76);--panel:#0C1118;--card:#0F151E;--card2:#131A25;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.05);
  --tx:#E8ECF3;--tx2:#97A1B3;--tx3:#7A8597;
  --pt:#F2C14E;--pt-bg:rgba(242,193,78,.12);
  --go:#2BE38C;--gap:#4DA3FF;--no:#FF4D5E;--watch:#7C8699;
  --up:#FF7A85;--dn:#62B5FF;
  --s1:#E8ECF3;--s2:#F2C14E;
  --r1:12px;--r2:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--tx);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
body.hq{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pt)}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:"JetBrains Mono","Pretendard Variable",monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--tx2)}
.small{font-size:13px}
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border:1px solid var(--line);border-radius:var(--r2)}
.up{color:var(--up)}.down{color:var(--dn)}

#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 20px;background:radial-gradient(1200px 600px at 70% -10%,rgba(242,193,78,.10),transparent 60%),var(--ink)}
.gate-box{width:100%;max-width:400px}
.gate-box .eb{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.24em;color:var(--pt);font-weight:800}
.gate-box h1{font-size:40px;line-height:1.15;margin:14px 0 10px;letter-spacing:-.03em;font-weight:800}
.gate-box p{margin:0 0 28px;color:var(--tx2)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--pt);box-shadow:0 0 0 4px rgba(242,193,78,.18);animation:bl 2s infinite;flex:none}
@keyframes bl{50%{box-shadow:0 0 0 9px rgba(242,193,78,0)}}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--tx2);margin:0 0 6px;letter-spacing:.04em}
.inp{width:100%;height:52px;border:1px solid var(--line);border-radius:var(--r1);background:rgba(255,255,255,.04);padding:0 16px;outline:none}
.inp:focus{border-color:var(--pt);box-shadow:0 0 0 3px rgba(242,193,78,.15)}
select{background-color:#0F151E}
option,optgroup{background:#0F151E;color:var(--tx)}
.btn{height:44px;border-radius:var(--r1);border:1px solid var(--line);background:rgba(255,255,255,.04);padding:0 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:rgba(255,255,255,.2)}
.btn-p{background:var(--pt);border-color:var(--pt);color:#0A0D12}
.btn-p:hover{background:#FFD36A;border-color:#FFD36A}
.btn:disabled{opacity:.4;cursor:default}
.btn-s{height:34px;font-size:13px;padding:0 12px;border-radius:10px}
.btn-x{color:var(--no);border-color:transparent;background:transparent}
.err{color:var(--no);font-size:14px;min-height:22px;margin:8px 0 0}

.hdr{position:fixed;left:16px;right:16px;top:14px;z-index:30;display:flex;align-items:center;gap:10px;pointer-events:none}
.hdr>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 16px;height:48px;white-space:nowrap}
.brand b{font-size:14px;letter-spacing:.04em;font-weight:800}
.brand span{font-size:11px;color:var(--pt);letter-spacing:.24em;font-weight:800}
.region-sel{height:48px;padding:0 14px;font-weight:700;font-size:14px;max-width:280px;min-width:0;color:var(--tx)}
.tabs{margin-left:auto;display:flex;gap:2px;padding:5px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--tx2);font-size:13px;font-weight:700;height:38px;padding:0 14px;border-radius:12px;white-space:nowrap}
.tab.on{background:rgba(255,255,255,.1);color:#fff}
.tab .num{color:var(--pt);margin-left:2px}
.icon-btn{width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--tx)}
.icon-btn svg{width:20px;height:20px}

#map{position:fixed;inset:0;z-index:0;background:var(--ink)}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#hud .glass,#hud #sheet{pointer-events:auto}
.call{position:absolute;left:16px;top:78px;width:410px;padding:22px 22px 18px;max-height:calc(100vh - 236px);overflow:auto;scrollbar-width:none}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--pt);font-weight:800}
.call h1{font-size:30px;line-height:1.28;margin:10px 0 8px;font-weight:800;letter-spacing:-.025em}
.call h1 em{font-style:normal;color:var(--pt)}
.call .meta{font-size:12px;color:var(--tx3);margin:0 0 14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:14px;overflow:hidden}
.kpi{background:rgba(9,12,18,.62);padding:12px 14px}
.kpi .k{font-size:11px;color:var(--tx2);letter-spacing:.03em}
.kpi .v{font-size:24px;font-weight:800;margin-top:2px}
.kpi .d{font-size:12px;margin-top:1px;color:var(--tx2)}
.g{color:var(--go)}
.spark{display:block;margin-top:6px;width:100%}
.bseg{display:flex;gap:4px;margin-top:14px;flex-wrap:wrap}
.bseg button{flex:1;min-width:52px;height:32px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--tx2);font-size:12px;font-weight:700}
.bseg button.on{border-color:var(--pt);color:var(--pt)}
.rank{position:absolute;right:16px;top:78px;bottom:108px;width:370px;display:flex;flex-direction:column}
.rank-h{padding:12px 14px 8px}
.modes{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 12px}
.modes button{border:1px solid var(--line);background:transparent;color:var(--tx2);font-size:12px;font-weight:700;height:30px;padding:0 10px;border-radius:999px;display:flex;align-items:center;gap:6px}
.modes button i{width:7px;height:7px;border-radius:50%}
.modes button.on{background:rgba(255,255,255,.1);color:#fff;border-color:transparent}
.rank-h .t{font-size:18px;font-weight:800;letter-spacing:-.01em;padding:0 4px}
.rank-h .s{font-size:12px;color:var(--tx2);margin-top:1px;padding:0 4px}
.rank-l{overflow:auto;padding:0 6px 10px;scrollbar-width:thin;scrollbar-color:#2a3140 transparent;flex:1}
.item{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-radius:12px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left}
.item:hover,.item.hl{background:rgba(255,255,255,.06)}
.item .n{font-size:18px;font-weight:800;color:var(--tx3)}
.item .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .rs{font-size:11.5px;color:var(--tx2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .p{text-align:right;font-weight:800;font-size:15px}
.item .p small{display:block;font-size:11px;font-weight:500;color:var(--tx2)}
.bar{height:3px;border-radius:2px;margin-top:6px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%}
.card3{position:absolute;right:16px;top:78px;bottom:auto;max-height:calc(100vh - 186px);width:370px;padding:20px;overflow:auto;transform:translateX(420px);opacity:0;visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s,visibility .45s;z-index:2;background:rgba(9,12,18,.95)}
.card3.on{transform:none;opacity:1;visibility:visible}
.card3 .x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--tx2)}
.vchip{display:inline-flex;height:24px;align-items:center;padding:0 10px;border-radius:999px;font-size:12px;font-weight:800;color:#06080C}
.card3 h2{font-size:22px;margin:10px 0 2px;letter-spacing:-.02em;padding-right:40px}
.big{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:12px 0 0}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.trio>div{border:1px solid var(--line);border-radius:12px;padding:10px}
.trio .k{font-size:11px;color:var(--tx2)}.trio .v{font-size:16px;font-weight:800;margin-top:2px}
.say{font-size:13px;color:#C9D1DE;line-height:1.65;border-left:2px solid var(--pt);padding-left:12px;margin:6px 0 14px}
.legend{position:absolute;left:16px;bottom:108px;padding:9px 14px;font-size:12px;color:var(--tx2);display:flex;gap:14px;align-items:center;border-radius:12px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.tape{position:absolute;left:16px;right:16px;bottom:46px;height:46px;display:flex;align-items:center;border-radius:14px;overflow:hidden}
.tape .tl{flex:none;height:100%;display:flex;align-items:center;padding:0 16px;font-size:11px;letter-spacing:.2em;font-weight:800;color:var(--pt);border-right:1px solid var(--line)}
.tape-in{flex:1;overflow:hidden;height:100%;display:flex;align-items:center}
.run{display:flex;gap:34px;white-space:nowrap;animation:run 120s linear infinite;padding-left:24px}
.tape:hover .run{animation-play-state:paused}
@keyframes run{to{transform:translateX(-50%)}}
.tourbtn{width:100%;margin-top:10px;border-color:rgba(242,193,78,.35);color:var(--pt)}
.tk{font-size:13px;color:var(--tx2);cursor:pointer}.tk b{color:var(--tx);font-weight:700}
.maptip{position:fixed;z-index:25;pointer-events:none;padding:10px 12px;font-size:12px;line-height:1.5;border-radius:12px}
.maptip b{font-size:14px}
.sheet-h{display:none}
.vwattr{display:none;font-size:11px;color:var(--tx3);text-align:center;padding:6px 0 4px}
#map .cesium-viewer-bottom,#map .cesium-widget-credits{display:none!important}
.hq-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:24px;width:min(420px,calc(100vw - 32px));text-align:center}

#page{position:relative;z-index:20;min-height:100vh;background:radial-gradient(900px 420px at 85% -10%,rgba(242,193,78,.06),transparent 60%),var(--ink);padding-top:78px}
main{max-width:1200px;margin:0 auto;padding:20px 20px 60px}
.sec-l{font-size:12px;font-weight:700;color:var(--tx2);letter-spacing:.06em;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:16px}
.grid2{display:grid;gap:16px}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.head-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0 0 16px}
.head-row h2{font-size:28px;margin:0;letter-spacing:-.03em;font-weight:800}
.stack>*+*{margin-top:28px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.v-go{background:rgba(43,227,140,.14);color:var(--go)}
.v-gap{background:rgba(77,163,255,.15);color:var(--gap)}
.v-no{background:rgba(255,77,94,.15);color:var(--no)}
.v-watch{background:rgba(124,134,153,.16);color:#A9B2C3}
.v-hold{background:rgba(255,255,255,.05);color:var(--tx3)}
.f-sig{background:rgba(242,193,78,.16);color:var(--pt)}
.f-rb{background:rgba(180,140,255,.16);color:#C9AEFF}
.locbox{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 14px;background:rgba(255,255,255,.02)}
.lb-h{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2)}
.grade{display:inline-flex;width:26px;height:26px;border-radius:8px;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#06080C}
.g-S{background:#F2C14E}.g-A{background:#2BE38C}.g-B{background:#8A94A8}.g-C{background:#4A5468;color:#E8ECF3}
.lchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lchip{font-size:12px;padding:3px 8px;border-radius:999px;background:rgba(43,227,140,.10);color:#9FF0C8}
.lchip.w{background:rgba(255,77,94,.10);color:#FF9AA5}
.ltab{width:100%;border-collapse:collapse;font-size:13px}
.ltab td{padding:8px 6px;border-bottom:1px solid var(--line2);vertical-align:top}
.ltab td:first-child{color:var(--tx2);white-space:nowrap;width:88px}
.ltab .sb{width:64px}.ltab .sb i{display:block;height:6px;border-radius:3px;background:var(--go)}
.ltab .nt{display:block;font-size:11px;color:var(--tx3);margin-top:2px}
.temp{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(9,12,18,.5)}
.temp-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--tx2)}
.temp-bar{height:8px;border-radius:4px;margin:10px 0 4px;background:linear-gradient(90deg,#4DA3FF,#8A94A8 50%,#FF4D5E);position:relative}
.temp-bar i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:#fff;box-shadow:0 0 0 2px #06080C}
.temp ul{margin:8px 0 0;padding:0;list-style:none;font-size:12px;color:var(--tx2)}
.temp li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.sup{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(9,12,18,.5)}
.sup-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--tx2);letter-spacing:.03em}
.sup-h b{font-size:12px;padding:2px 8px;border-radius:999px}
.sig-down{background:rgba(43,227,140,.14);color:var(--go)}.sig-up{background:rgba(255,77,94,.15);color:var(--no)}.sig-mid{background:rgba(255,255,255,.06);color:var(--tx2)}
.sup .d{font-size:12px;color:var(--tx2);margin-top:6px}
.f-urg{background:transparent;color:var(--tx2);box-shadow:inset 0 0 0 1px var(--line)}
.f-drop{background:rgba(98,181,255,.14);color:var(--dn)}
.f-chk{background:rgba(255,255,255,.06);color:var(--tx2)}
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;min-height:56px;border-top:1px solid var(--line2);width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
button.row:hover{background:rgba(255,255,255,.04)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700}
.row .s{font-size:13px;color:var(--tx2)}
.row .r{text-align:right;flex:none}
.row .r .p{font-weight:800}
.empty{padding:20px 16px;color:var(--tx2);font-size:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.filters select,.filters input[type=search],.filters input[type=number]{height:40px;border:1px solid var(--line);border-radius:var(--r1);background:#0F151E;padding:0 12px;color:var(--tx)}
.filters input[type=search]{min-width:160px;flex:1;max-width:280px}
.filters input[type=number]{width:96px}
.tog{height:40px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r1);background:transparent;padding:0 14px;font-size:13px;font-weight:700;color:var(--tx2)}
.tog.on{border-color:var(--pt);color:var(--pt);background:var(--pt-bg)}
.cnt{font-size:13px;color:var(--tx2);margin:0 0 8px}
.tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:auto;max-height:min(680px,72vh)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{padding:11px 12px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
table.t th{position:sticky;top:0;background:#121926;font-size:12px;color:var(--tx2);font-weight:700;z-index:1;cursor:pointer;user-select:none}
table.t th.nos{cursor:default}
table.t th:first-child,table.t td:first-child{text-align:left;position:sticky;left:0;background:inherit;z-index:2}
table.t th:first-child{z-index:3;background:#121926}
table.t tbody tr{background:var(--card);cursor:pointer}
table.t tbody tr:hover{background:#151C28}
table.t td.nm{max-width:200px;overflow:hidden;text-overflow:ellipsis;font-weight:700}
th .arr{font-size:10px;margin-left:2px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis{fill:var(--tx3);font-size:11px}
.chart .grid{stroke:rgba(255,255,255,.06);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:rgba(0,0,0,.92);border:1px solid var(--line);color:#fff;font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5;line-height:1.5}
.legend2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--tx2);margin:0 0 6px}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cap{font-size:12px;color:var(--tx3);margin-top:6px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.panel{position:fixed;z-index:41;background:var(--panel);overflow:auto;inset:0}
@media(min-width:900px){.panel{inset:0 0 0 auto;width:580px;border-left:1px solid var(--line)}}
.panel-h{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px;z-index:2}
.panel-h h3{flex:1;font-size:18px;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel-b{padding:16px 16px 40px}
.panel .icon-btn,.modal .icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:transparent}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
@media(min-width:900px){.kv{grid-template-columns:repeat(3,1fr)}}
.kv>div{background:var(--card);padding:12px 14px}
.kv .k{font-size:12px;color:var(--tx2)}
.kv .v{font-weight:800}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.seg button{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:700;color:var(--tx2)}
.seg button.on{border-color:var(--pt);color:var(--pt);background:var(--pt-bg)}
.why{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--pt);border-radius:0;padding:10px 14px;font-size:14px}
.modal{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-h{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-h h3{flex:1;margin:0;font-size:17px}
.modal-b{padding:16px}
.scrim.top{z-index:50}
.sugg{border:1px solid var(--line);border-radius:var(--r1);margin-top:6px;max-height:240px;overflow:auto;background:var(--card)}
.sugg button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line2);background:transparent;padding:10px 12px;min-height:44px}
.sugg button:first-child{border-top:0}
.sugg button:hover{background:rgba(255,255,255,.05)}

.loading{padding:48px 0;text-align:center;color:var(--tx2)}

  .card3{left:0;right:0;top:auto;bottom:0;width:auto;max-height:72vh;border-radius:22px 22px 0 0;transform:translateY(105%)}

<!-- 입장 -->
<section id="gate" class="hidden">
  <form class="gate-box" id="gateForm" autocomplete="off">
    <div class="eb"><i class="dot"></i>APARTMENT RADAR · VIP</div>
    <h1>아파트 레이더</h1>
    <p>초대받은 분만 들어올 수 있습니다. 받은 입장 코드를 넣어 주세요.</p>
    <label class="lbl" for="codeInp">입장 코드</label>
    <input class="inp num" id="codeInp" placeholder="VIP-XXXX-XXXX" maxlength="20" autocapitalize="characters" spellcheck="false">
    <div class="err" id="gateErr"></div>
    <button class="btn btn-p" id="gateBtn" style="width:100%;margin-top:8px">들어가기</button>
  </form>
</section>

<!-- 앱 -->
<div id="app" class="hidden">
  <header class="hdr">
    <div class="glass brand"><i class="dot"></i><b>APARTMENT RADAR</b><span>VIP</span></div>
    <select class="glass region-sel" id="regionSel" aria-label="지역 선택"></select>
    <nav class="glass tabs" id="tabs">
      <button class="tab on" data-tab="hq">관제실</button>
      <button class="tab" data-tab="cx">단지</button>
      <button class="tab" data-tab="ls">매물</button>
      <button class="tab" data-tab="cmp">비교<span id="cmpN" class="num"></span></button>
      <button class="tab" data-tab="rep">AI 리포트</button>
    </nav>
    <button class="glass icon-btn" id="menuBtn" aria-label="설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>

  <div id="map"></div>
  <div id="hud">
    <div id="sheet" class="glass">
      <div class="sheet-h"><button id="sheetBtn" aria-label="목록 크게 보기"><i></i></button></div>
      <section class="glass call" id="call"><div class="loading"><span class="spin"></span> 불러오는 중</div></section>
      <aside class="glass rank" id="rank">
        <div class="rank-h">
          <div class="modes" id="modes">
            <button data-m="all" class="on">전체</button>
            <button data-m="go"><i style="background:var(--go)"></i>들어갈 자리</button>
            <button data-m="gap"><i style="background:var(--gap)"></i>소액 갭</button>
            <button data-m="no"><i style="background:var(--no)"></i>손대지 마</button>
            <button data-m="deal"><i style="background:var(--pt)"></i>저평가 매물</button>
            <button data-m="rb"><i style="background:#B48CFF"></i>재건축</button>

        </div>
        <div class="rank-l" id="rankL"></div>
      </aside>
      <div class="vwattr">3D 지도 · 국토교통부 브이월드</div>
    </div>
    <aside class="glass card3" id="card3" aria-live="polite"></aside>
    <div class="glass legend"><span>멀리 = 기둥 높이가 실거래 중앙값 · 가까이 = 실사 건물 둘레 빛 테두리</span><span><i style="background:var(--go)"></i>들어갈 자리</span><span><i style="background:var(--gap)"></i>소액 갭</span><span><i style="background:var(--no)"></i>손대지 마</span><span><i style="background:var(--watch)"></i>지켜볼 자리</span></div>
    <div class="glass tape"><div class="tl">TAPE</div><div class="tape-in"><div class="run" id="tape"></div></div></div>
  </div>
  <div class="glass maptip hidden" id="maptip"></div>

  <div id="page" class="hidden">

</div>

/* ───── 그래프 (SVG, 한 축) ───── */
function niceTicks(min, max, n = 4) {
  if (min === max) { min -= 1; max += 1; }
  const step0 = (max - min) / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= step0);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, t = [];
  for (let v = lo; v <= hi + 1e-9; v += step) t.push(v);
  return t;
}
function frame(el, W = 600, H = 220) {
  const P = { l: 52, r: 16, t: 12, b: 26 };
  el.innerHTML = ''; el.style.position = 'relative';
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); el.appendChild(svg);
  const tip = document.createElement('div'); tip.className = 'tip hidden'; el.appendChild(tip);
  return { svg, tip, W, H, P };
}
function lineChart(el, series, o) {
  const all = series.flatMap(s => s.pts);
  if (!all.length) { el.innerHTML = '<div class="empty">그릴 거래가 없습니다.</div>'; return; }
  const F = frame(el, 600, o.labelEnd ? 240 : 220); const { svg, tip, W, H, P } = F;
  if (o.labelEnd) P.r = 16;
  const x0 = o.x0 ?? Math.min(...all.map(p => p.x)), x1 = o.x1 ?? Math.max(...all.map(p => p.x));
  const ys = all.map(p => p.y), ticks = niceTicks(Math.min(...ys) * 0.97, Math.max(...ys) * 1.03);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = x => P.l + (x - x0) / Math.max(1, x1 - x0) * (W - P.l - P.r);
  const Y = y => H - P.b - (y - y0) / (y1 - y0) * (H - P.t - P.b);
  let g = ticks.map(t => `<line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${Y(t)}" y2="${Y(t)}"/><text class="axis" x="${P.l - 6}" y="${Y(t) + 4}" text-anchor="end">${o.fmt(t)}</text>`).join('');
  for (let x = x0; x <= x1; x += 6) g += `<text class="axis" x="${X(x)}" y="${H - 6}" text-anchor="middle">${o.xl(x)}</text>`;
  for (const s of series) {
    if (!s.pts.length) continue;
    const pts = s.pts.slice().sort((a, b) => a.x - b.x);
    g += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (o.dots) g += pts.map(p => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" fill="${s.color}" stroke="#fff" stroke-width="1.5"/>`).join('');
  }
  g += `<line id="xh" class="hidden" y1="${P.t}" y2="${H - P.b}" stroke="#94A3B8" stroke-dasharray="3 3"/>`;
  g += `<rect x="${P.l}" y="${P.t}" width="${W - P.l - P.r}" height="${H - P.t - P.b}" fill="transparent" id="hit"/>`;
  svg.innerHTML = g;
  const xh = svg.querySelector('#xh');
  const move = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * W;
    const x = Math.round(x0 + (px - P.l) / (W - P.l - P.r) * (x1 - x0));
    if (x < x0 || x > x1) return;
    const lines = series.map(s => { const p = s.pts.find(q => q.x === x); return p ? `<span style="color:${s.color === 'var(--s1)' ? '#E8ECF3' : s.color === 'var(--s2)' ? '#F2C14E' : s.color}">■</span> ${esc(s.name)} ${o.fmt(p.y)}${p.n ? ` (${p.n}건)` : ''}` : null; }).filter(Boolean);
    if (!lines.length) { tip.classList.add('hidden'); xh.classList.add('hidden'); return; }
    xh.setAttribute('x1', X(x)); xh.setAttribute('x2', X(x)); xh.classList.remove('hidden');
    tip.innerHTML = `<b>${o.xl(x)}</b><br>${lines.join('<br>')}`; tip.classList.remove('hidden');
    tip.style.left = Math.min(Math.max(X(x) / W * r.width, 70), r.width - 70) + 'px'; tip.style.top = (P.t / H * r.height + 8) + 'px';
  };
  const hit = svg.querySelector('#hit');
  hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { tip.classList.add('hidden'); xh.classList.add('hidden'); });
}

const SYS = `너는 한국 아파트 시장을 숫자로 읽는 직설형 투자 분석가다. 독자는 돈을 넣을지 말지 정하려는 투자자다. 돌려 말하지 말고 결론부터 세게 쓴다.

규칙
1. 숫자는 받은 JSON에 있는 것만 쓴다. 필요하면 JSON 값끼리 단순 계산(차이·비율)만 한다. 시세·금리·정책·뉴스·개발 호재 같은 바깥 정보는 쓰지 않는다. 모르는 건 모른다고 쓴다.
2. 결론은 단정형 한 줄로 쓴다(예: «여기는 들어갈 자리다», «싸 보여도 손대지 마라»). 그 바로 아래에 근거 숫자 2~4개를 붙인다.
3. 판정·흐름은 엔진이 정한 값을 따른다. 뒤집지 않는다. 걸리는 점은 «다만»으로 덧붙인다.
4. 전세가율은 높낮이보다 이유를 말한다. 전세가율_이유가 «전세가 민다»면 적은 돈으로 들어갈 기회, «매매가 빠져 붙음»이면 싸 보이는 함정이다.
5. 갭투자를 권할 때는 반드시 한 줄씩 덧붙인다: 2년 뒤 전세가가 떨어지면 그 차액을 내 돈으로 돌려줘야 한다(역전세), 그 지역이 토지거래허가구역·규제지역인지 직접 확인하라.
6. 흐름이 «표본 부족»인 곳은 판단하지 않는다고 쓴다.
7. 매물은 중개사 설명에 적힌 것 말고 «왜 싼지» 지어내지 않는다. 층추정이 있으면 층이 정확하지 않다고 밝힌다.
8. 맨 끝에 «우선순위» 섹션을 두고 1·2·3위를 한 줄 이유와 함께 고른다. 고를 게 없으면 «지금은 사지 마라»도 답이다.
9. 면책 문구는 쓰지 않는다(화면이 붙인다).
10. 입주물량이 있으면 반드시 한 단락으로 다룬다. signal이 «공급 감소»면 앞으로 매매·전세에 우호적, «공급 많음»이면 전세가가 눌리고 역전세 위험이 커진다. next24·past36·ratio 숫자를 근거로 쓴다. 입주물량은 네이버에 등록된 100세대 이상 단지 기준이라 실제보다 적을 수 있다고 한 번 밝힌다.
12. 입지는 입지점수·입지등급(구 안 상대 순위)·입지요소를 근거로 쓴다. 역세권·초품아·직주근접·학군·대단지·신축·브랜드처럼 값을 실제로 올리는 요소를 먼저 말하고, «추정»이라 적힌 요소(조망·커뮤니티)와 매물 설명에서 뽑은 요소(판상형·교통 호재)는 확인이 필요하다고 밝힌다. 입지대비가격이 −8% 이하면 «입지에 비해 싸다», +8% 이상이면 «입지에 비해 비싸다»고 단정한다.
13. 시장온도·금리를 맨 앞 총평에 반영한다. 주담대 금리가 오르는 중이면 매수 타이밍을 서두르지 말라고, 내리는 중이면 거래가 살아날 수 있다고 쓴다. 학군은 학원가(동 단위 추정)·가까운 중학교 전입·전출로 판단한다. 전입이 전출보다 많으면 학군 수요가 있다는 뜻이다. 학업성취도는 자료에 없으니 «명문 학군»이라고 단정하지 않는다.
11. 재건축단계가 있는 단지는 연식으로 깎아 보지 말고 단계(추진위→안전진단→조합설립→사업시행인가→관리처분→이주·철거)와 분담금·사업 지연 위험을 말한다. 단계는 매물 설명에서 찾은 것이라 조합·구청 확인이 필요하다고 쓴다.

출력 형식
- HTML 조각만 출력한다. 마크다운·코드펜스 금지. 전체를 <article> 하나로 감싼다.
- 쓸 수 있는 태그: h1 h2 h3 p ul ol li table thead tbody tr th td strong em span section div blockquote.
- 쓸 수 있는 class: verdict-go(들어갈 자리), verdict-gap(소액 갭), verdict-no(손대지 마), verdict-watch(지켜볼), num(숫자), up(상승), down(하락), note(작은 참고), card(묶음 상자), lead(맨 위 한 줄 총평).
- style 속성, script, img, a, 외부 링크 금지.
- 가격은 «6억 2,000만»처럼 억·만 단위로, 비율은 «+4.2%»처럼 쓴다.
- 첫 줄은 <h1>, 그 다음 <p class="lead">에 한 문장 총평.`;

    ($('#repErr') || {}).textContent = err.code === 'refusal' ? 'Claude가 이 요청을 거절했습니다. 다른 종류로 다시 시도하세요.'
      : s === 401 ? 'API 키가 맞지 않습니다. 키를 다시 확인하세요.'
      : s === 429 ? '요청이 몰렸습니다. 1분 뒤 다시 시도하세요.'
      : s === 400 && /credit|balance/i.test(err.message) ? 'Anthropic 계정 크레딧이 부족합니다.'
      : s >= 500 ? 'Anthropic 서버가 잠시 응답하지 않습니다. 잠시 뒤 다시 시도하세요.'
      : '리포트를 만들지 못했습니다: ' + String(err.message || err).slice(0, 160);
  } finally {
    R.busy = false; btn.innerHTML = '리포트 만들기'; updCost();
  }
}
function cleanHtml(h) {
  h = h.replace(/^```(?:html)?\s*/i, '').replace(/```\s*$/, '');
  const doc = new DOMParser().parseFromString(`<body>${h}</body>`, 'text/html');
  doc.querySelectorAll('script,style,iframe,object,embed,img,a,link,meta,form').forEach(n => n.replaceWith(...n.childNodes));
  doc.querySelectorAll('*').forEach(n => [...n.attributes].forEach(a => { if (a.name !== 'class' && a.name !== 'colspan' && a.name !== 'rowspan') n.removeAttribute(a.name); }));
  return doc.body.innerHTML;
}
const REP_CSS = `body{margin:0;background:#06080C;color:#E8ECF3;font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;font-size:15px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}

function reportDoc(body) {
  const m = S.rep.meta || {};
  return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="script-src 'none'"><title>${esc(m.title || '아파트 레이더 리포트')}</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><style>${REP_CSS}</style></head><body><div class="wrap"><div class="brand">아파트 레이더 VIP · ${esc(m.at || '')} 자료 · ${esc(m.model || '')}</div>${body}<div class="foot">이 리포트는 국토교통부 실거래가 공개자료와 공개 매물 정보를 코드로 집계한 숫자에 AI가 해석을 붙인 것입니다. 투자 권유가 아니며, 매물 정보는 실제와 다를 수 있습니다. 거래 전 등기부·현장·토지거래허가구역 및 규제지역 여부를 직접 확인하세요. 투자 판단과 책임은 본인에게 있습니다.</div></div></body></html>`;
}
function showReport(html, final) {
  const f = $('#repFrame'); if (!f) return;
  f.srcdoc = reportDoc(cleanHtml(html) + (final ? '' : '<p class="note">쓰는 중…</p>'));
  $('#repOut').classList.remove('hidden');
  $('#repSave').onclick = () => {
    const blob = new Blob([reportDoc(cleanHtml(S.rep.html))], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `${(S.rep.meta?.title || '리포트').replace(/[\\/:*?"<>|·]/g, '').replace(/\s+/g, '_')}.html`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $('#repOpen').onclick = () => {
    const blob = new Blob([reportDoc(cleanHtml(S.rep.html))], { type: 'text/html;charset=utf-8' });
    window.open(URL.createObjectURL(blob), '_blank', 'noopener');
  };
}

/* ───── 시작 ───── */
(function boot() {
  try { const last = JSON.parse(store.get('av_lastrep') || 'null'); if (last) { S.rep.html = last.html; S.rep.meta = last.meta; } } catch (_) {}
  if (S.code) {
    enter(S.code).catch(err => {
      if (err.code === 'bad_code' || err.code === 'stopped') store.del('av_code');
      $('#gate').classList.remove('hidden'); $('#app').classList.add('hidden');
      $('#codeInp').value = S.code || '';
      $('#gateErr').textContent = err.code === 'stopped' ? '사용이 중지된 코드입니다.' : err.code === 'bad_code' ? '' : '연결하지 못했습니다. 다시 시도하세요.';
    });
  } else {
    $('#gate').classList.remove('hidden');
  }
})();
